<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5c4"/>
      <stop offset="100%" stop-color="#ffefa6"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
  </defs>

  <!-- Pale-yellow rounded square (matches the pill fill) -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Subtle amber-gold border, matching the pill stroke -->
  <rect x="3" y="3" width="506" height="506" rx="93" ry="93"
        fill="none" stroke="#c2a74e" stroke-width="6"/>

  <!-- Abstract brush strokes -->
  <g opacity="0.55">
    <path d="M 40 380 Q 180 320 320 360 T 480 340" stroke="#1d3557" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 30 420 Q 200 380 380 410 T 490 400" stroke="#06a677" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 60 130 Q 220 90 360 120 T 470 110" stroke="#118ab2" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Vertical "shorts" frame -->
  <rect x="156" y="86" width="200" height="340" rx="28" ry="28"
        fill="#fdfdfd" stroke="#c2a74e" stroke-width="6"/>

  <!-- Play triangle -->
  <polygon points="218,196 218,316 326,256" fill="url(#play)"/>

  <!-- Accent dots (amber-gold to match the tag border) -->
  <circle cx="256" cy="64" r="10" fill="#c2a74e"/>
  <circle cx="256" cy="448" r="10" fill="#e63946"/>
</svg>
