[package]
name = "create_shorts_gui"
version = "1.0.57"
edition = "2021"
description = "Cross-platform GUI for extracting a YouTube segment and re-uploading it as a new video."
license = "GPL-3.0-only"
authors = [
    "Zeno R.R. Davatz <zdavatz@ywesee.com>",
]
homepage = "https://github.com/zdavatz/old2new"
repository = "https://github.com/zdavatz/old2new"

[[bin]]
name = "create_shorts_gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
dirs = "5"
crossbeam-channel = "0.5"
open = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.15"
ab_glyph = "0.2"
printpdf = { version = "0.7", default-features = false }
# Runtime dlopen of libmpv for the in-window video preview (software render →
# egui texture). No build-time link, so the app still builds/launches with mpv
# absent; the preview just falls back to the browser split view.
libloading = "0.8"

# Cancel kills the whole process group (yt-dlp + its ffmpeg grandchild), which
# needs `kill(-pgid, SIGKILL)`. Already in the dependency tree transitively, so
# declaring it directly is free.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# winit 0.30.x calls the private macOS symbol
# `_CGSSetWindowBackgroundBlurRadius` from `Window::set_blur` (winit#4538).
# Apple's binary scanner rejects any binary that imports private symbols,
# so even though this app ships only via GitHub Release (no App Store),
# we keep the same `set_blur` no-op patch as `rust2xml`,
# `eudamed2firstbase` etc. Nothing in the GUI calls `set_blur` — the
# patch just removes the offending extern.
[patch.crates-io]
winit = { path = "winit-patched" }
