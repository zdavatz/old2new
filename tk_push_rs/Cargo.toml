[package]
name = "tk_push"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
open = "5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2"

[profile.release]
strip = true
lto = true
