name: create_shorts release

# Fires whenever a `create-shorts-vX.Y.Z` tag is pushed (or via
# workflow_dispatch). Builds release binaries for Linux, macOS
# (universal), and Windows; on macOS produces a notarized DMG when
# Developer ID + Apple API key secrets are present.

on:
  push:
    tags:
      - "create-shorts-v[0-9]+.[0-9]+.[0-9]+"
      - "create-shorts-v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to release (e.g. create-shorts-v1.0.1)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CRATE_DIR: create_shorts_gui

defaults:
  run:
    working-directory: create_shorts_gui

jobs:
  # --- Linux + Windows binaries (no signing) ---------------------------
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            binary-suffix: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            binary-suffix: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: create_shorts_gui

      - name: install Linux GUI build deps
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev libgl1-mesa-dev

      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }} --bin create_shorts_gui

      - name: resolve tag / version
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#create-shorts-v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stem=create_shorts-${version}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: stage artifact
        shell: bash
        run: |
          mkdir -p "dist/${{ steps.vars.outputs.stem }}"
          cp "target/${{ matrix.target }}/release/create_shorts_gui${{ matrix.binary-suffix }}" \
             "dist/${{ steps.vars.outputs.stem }}/"

      - name: pack tar.gz
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd dist
          tar czf "${{ steps.vars.outputs.stem }}.tar.gz" "${{ steps.vars.outputs.stem }}"
          shasum -a 256 "${{ steps.vars.outputs.stem }}.tar.gz" \
            > "${{ steps.vars.outputs.stem }}.tar.gz.sha256"

      - name: pack zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path "${{ steps.vars.outputs.stem }}" `
            -DestinationPath "${{ steps.vars.outputs.stem }}.zip"
          (Get-FileHash "${{ steps.vars.outputs.stem }}.zip" -Algorithm SHA256).Hash.ToLower() `
            + "  ${{ steps.vars.outputs.stem }}.zip" `
            | Out-File -Encoding ASCII "${{ steps.vars.outputs.stem }}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.stem }}
          path: |
            create_shorts_gui/dist/${{ steps.vars.outputs.stem }}.tar.gz
            create_shorts_gui/dist/${{ steps.vars.outputs.stem }}.tar.gz.sha256
            create_shorts_gui/dist/${{ steps.vars.outputs.stem }}.zip
            create_shorts_gui/dist/${{ steps.vars.outputs.stem }}.zip.sha256
          if-no-files-found: ignore

  # --- macOS universal .app + DMG + notarization -----------------------
  macos:
    name: macOS notarized DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: create_shorts_gui
          key: macos-universal

      - name: resolve version
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#create-shorts-v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: build universal binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target aarch64-apple-darwin --bin create_shorts_gui
          cargo build --release --target x86_64-apple-darwin  --bin create_shorts_gui
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/create_shorts_gui \
            target/x86_64-apple-darwin/release/create_shorts_gui \
            -output target/release/create_shorts_gui-universal

      - name: assemble create_shorts.app
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.vars.outputs.version }}"
          app="target/release/create_shorts.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/create_shorts_gui-universal "$app/Contents/MacOS/create_shorts_gui"
          chmod +x "$app/Contents/MacOS/create_shorts_gui"

          tmp_iconset="$(mktemp -d)/icon.iconset"
          mkdir -p "$tmp_iconset"
          for size in 16 32 64 128 256 512; do
            sips -z "$size" "$size" assets/icon.png \
              --out "$tmp_iconset/icon_${size}x${size}.png" >/dev/null
            dbl=$((size * 2))
            sips -z "$dbl" "$dbl" assets/icon.png \
              --out "$tmp_iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$tmp_iconset" -o "$app/Contents/Resources/icon.icns"

          sed "s/__VERSION__/${version}/g" assets/Info.plist.template \
            > "$app/Contents/Info.plist"

      - name: import Developer ID certificate
        if: env.MACOS_DEVELOPER_ID_CERTIFICATE != ''
        env:
          MACOS_DEVELOPER_ID_CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        working-directory: ${{ github.workspace }}
        run: |
          security create-keychain -p "" build.keychain
          security set-keychain-settings build.keychain
          security list-keychains -d user -s build.keychain login.keychain

          echo "$MACOS_DEVELOPER_ID_CERTIFICATE" | base64 --decode > devid_cert.p12
          security import devid_cert.p12 -k build.keychain \
            -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm devid_cert.p12

          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" build.keychain
          security find-identity -v build.keychain

      - name: code-sign (Developer ID + hardened runtime)
        if: env.MACOS_DEVELOPER_ID_CERTIFICATE != ''
        env:
          MACOS_DEVELOPER_ID_CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE }}
        run: |
          set -euo pipefail
          identity=$(security find-identity -v build.keychain \
            | grep "Developer ID Application" | head -1 \
            | sed 's/.*"\(.*\)"/\1/' || true)
          if [ -z "$identity" ]; then
            echo "ERROR: MACOS_DEVELOPER_ID_CERTIFICATE secret was provided but no Developer ID Application identity loaded."
            exit 1
          fi
          codesign --force --options runtime \
            --sign "$identity" \
            --entitlements entitlements.plist \
            --deep --timestamp \
            target/release/create_shorts.app
          codesign --verify --deep --strict --verbose=2 target/release/create_shorts.app

      - name: create DMG
        run: |
          set -euo pipefail
          version="${{ steps.vars.outputs.version }}"
          staging=$(mktemp -d)
          cp -R target/release/create_shorts.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "create_shorts" \
            -srcfolder "$staging" \
            -ov -format UDZO \
            "create_shorts-${version}-macos-universal.dmg"
          rm -rf "$staging"

      - name: notarize DMG
        if: env.APPLE_API_KEY_P8 != '' && env.MACOS_DEVELOPER_ID_CERTIFICATE != ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          MACOS_DEVELOPER_ID_CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE }}
        run: |
          set -euo pipefail
          version="${{ steps.vars.outputs.version }}"
          dmg="create_shorts-${version}-macos-universal.dmg"
          mkdir -p ~/.private_keys
          echo "$APPLE_API_KEY_P8" | base64 --decode \
            > "$HOME/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          xcrun notarytool submit "$dmg" \
            --key "$HOME/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$dmg"

      - name: write SHA-256
        run: |
          version="${{ steps.vars.outputs.version }}"
          dmg="create_shorts-${version}-macos-universal.dmg"
          shasum -a 256 "$dmg" > "${dmg}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            create_shorts_gui/create_shorts-*-macos-universal.dmg
            create_shorts_gui/create_shorts-*-macos-universal.dmg.sha256
          if-no-files-found: error

  # --- Attach everything to a GitHub Release ---------------------------
  publish:
    name: publish release
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: list staged artifacts
        working-directory: ${{ github.workspace }}
        run: ls -lh artifacts || true

      - name: resolve tag
        id: vars
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: create_shorts ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.vars.outputs.tag, '-') && !contains(steps.vars.outputs.tag, 'create-shorts-v1.0.0-') == false }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.zip
            artifacts/*.zip.sha256
            artifacts/*.dmg
            artifacts/*.dmg.sha256
