[package]
name = "status_server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
askama = "0.12"
tower-http = { version = "0.5", features = ["fs"] }
chrono = "0.4"
libc = "0.2"

[[bin]]
name = "status_server"
path = "src/main.rs"

[[bin]]
name = "rebalance_calc"
path = "src/rebalance_calc.rs"

[profile.release]
strip = true
lto = true
